[package]
name = "graphbuff-cli"
description = "Command-line client for graphbuff-server: run Cypher from the shell, scripts or an interactive prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "graphbuff-cli"
path = "src/main.rs"

[dependencies]
# Only for its JSON reader and writer (`graphbuff::json`); the client runs no queries itself.
graphbuff.workspace = true

[dev-dependencies]
graphbuff-server = { path = "../server" }

[features]
# https:// URLs with rustls. `tls` uses the ring crypto provider (needs a C compiler),
# `tls-rustcrypto` the pure-Rust RustCrypto provider (a pre-release). With both, ring is used.
tls = ["dep:rustls", "rustls/ring"]
tls-rustcrypto = ["dep:rustls", "dep:rustls-rustcrypto"]

[dependencies.rustls]
version = "0.23"
optional = true
default-features = false
features = ["std", "tls12"]

[dependencies.rustls-rustcrypto]
version = "=0.1.0-pre.0"
optional = true
