[package]
name = "graphbuff-cli"
description = "Interactive Cypher shell for graphbuff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "graphbuff"
path = "src/main.rs"

[dependencies]
graphbuff.workspace = true

[features]
# `--gpu`: run graph kernels on the GPU (wgpu).
gpu = ["graphbuff/gpu"]
