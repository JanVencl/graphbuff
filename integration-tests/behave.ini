[behave]
# Run from integration-tests/. All Python (hooks, steps, helpers) lives in python/;
# the .feature files stay in cucumber/features and tck/features.
paths = cucumber/features
runner = python.runner:Runner
# Outline rows are scenarios of their own: "<title> #<examples>.<row>".
scenario_outline_annotation_schema = {name} #{row.id}
show_skipped = false
