# Runs the openCypher TCK (integration-tests/tck/README.md) against graphbuff-server: every
# scenario, with the pass rate per feature group in the run's summary. Fails if a scenario in
# integration-tests/tck/passing.txt no longer passes. On a pull request that changes the code
# involved or the suite, and on demand.
name: tck

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tck.yml"
      - "crates/core/src/**"
      - "crates/cypher/src/**"
      - "crates/engine/src/**"
      - "crates/server/src/**"
      - "integration-tests/tck/**"
      - "integration-tests/python/**"
      - "integration-tests/behave.ini"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tck:
    name: openCypher TCK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # A release build: the debug one overflows its stack on some of the queries.
      - name: Build the server
        run: cargo build --release --locked -p graphbuff-server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the TCK
        working-directory: integration-tests
        env:
          GRAPHBUFF_SERVER: ${{ github.workspace }}/target/release/graphbuff-server
        run: |
          pip install -r python/requirements.txt
          python python/run_tck.py --failures --report "$RUNNER_TEMP/tck.md"
      - name: Show the pass rate
        if: always()
        run: if [ -f "$RUNNER_TEMP/tck.md" ]; then cat "$RUNNER_TEMP/tck.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload every scenario's outcome
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tck-results
          path: integration-tests/tck/results/results.tsv
          if-no-files-found: ignore
