# Pushing a tag `vX.Y.Z` publishes a release:
#   * archives of `graphbuff-server` (with TLS and embedding models) and `graphbuff-cli`
#     (with TLS) for Linux (x86-64 and ARM64), macOS and Windows, plus SHA256SUMS,
#     attached to the GitHub release of the tag. The macOS and Windows servers and the
#     `-gpu` Linux archives (glibc, so that they can load the Vulkan driver) have the GPU
#     (`gpu` feature); the static Linux archives do not;
#   * the image ghcr.io/janvencl/graphbuff, tagged X.Y.Z and latest (amd64 and arm64).
# A pull request that changes this workflow builds the archives, and publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  archives:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked (musl): runs on any x86-64 or ARM64 Linux, whatever its libc.
          # A static program cannot load the Vulkan driver, so these have no GPU.
          # The ARM64 builds run natively on GitHub's arm64 runners.
          - { name: linux-x86_64,      os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { name: linux-aarch64,     os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          # Dynamically linked (glibc 2.35 or newer), with the GPU (Vulkan).
          - { name: linux-x86_64-gpu,  os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  gpu: true }
          - { name: linux-aarch64-gpu, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, gpu: true }
          # With the GPU: Metal on macOS, Direct3D 12 or Vulkan on Windows.
          - { name: macos-arm64,       os: macos-latest,     target: aarch64-apple-darwin,      gpu: true }
          - { name: macos-x86_64,      os: macos-latest,     target: x86_64-apple-darwin,       gpu: true }
          - { name: windows-x86_64,    os: windows-latest,   target: x86_64-pc-windows-msvc,    gpu: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      # ring (the TLS crypto provider) compiles C: musl-gcc for the static Linux build.
      - name: Install musl-gcc
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p graphbuff-server -p graphbuff-cli
          --features graphbuff-server/tls,graphbuff-server/embed,graphbuff-cli/tls${{ matrix.gpu && ',graphbuff-server/gpu' || '' }}
      - name: Package
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          dir=graphbuff-$version-${{ matrix.name }}
          mkdir -p "$dir/config/model" dist
          cp README.md "$dir/"
          cp packaging/config/graphbuff.toml "$dir/config/"
          # The embedding model folder ([embedding] model_dir): empty but for how to fill it.
          cp packaging/model/README.md scripts/fetch-model.py "$dir/config/model/"
          bin=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            cp "$bin/graphbuff-server.exe" "$bin/graphbuff-cli.exe" "$dir/"
            7z a "dist/graphbuff-${{ matrix.name }}.zip" "$dir"
          else
            cp "$bin/graphbuff-server" "$bin/graphbuff-cli" "$dir/"
            tar -czf "dist/graphbuff-${{ matrix.name }}.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: graphbuff-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the archives: the image job uploads a build record (*.dockerbuild) that
      # cannot be extracted here when it finishes first.
      - uses: actions/download-artifact@v4
        with:
          pattern: graphbuff-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum graphbuff-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "graphbuff ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag

  image:
    name: container image
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/janvencl/graphbuff:${{ steps.version.outputs.version }}
            ghcr.io/janvencl/graphbuff:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
